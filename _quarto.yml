# ---------------------------------------------------------------------------
# MLB7052.LT — Modern Molecular Methods in Ecology
# Course website. `quarto render` builds the pages *and* every lecture deck.
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "seminars/index.qmd"
    # Student uploads are linked for download, never rendered — Quarto must not
    # execute code that arrives by pull request.
    - "!seminars/slides/"
    # Leftovers from an unrelated Shiny app; kept on disk, out of the site.
    - "!MolEcoMeth/"
    - "!www/"

# --- Course facts, read by the pages so they are stated in exactly one place -
course-code:     "MLB7052.LT"
course-title-et: "Kaasaegsed meetodid molekulaarses ökoloogias"
course-title-en: "Modern Molecular Methods in Ecology"
course-repo:     "https://github.com/peeterlaas/MolEcoMeth"
semester:        "2026/2027 autumn"
# First teaching Friday. Every date on the schedule page is derived from this,
# so moving the semester is a one-line change.
semester-start:  "2026-09-04"

# Logo paths, project-relative. The decks live one level down and prepend "..".
logo-tlu:     "assets/logos/UUtopleft.png"
logo-taltech: "assets/logos/taltech-logo.png"

website:
  title: "MLB7052.LT — Molecular Methods in Ecology"
  site-url: "https://peeterlaas.github.io/MolEcoMeth"
  favicon: "assets/logos/favicon.png"
  page-navigation: true
  reader-mode: true
  open-graph: true
  search:
    location: navbar
    type: textbox
  navbar:
    background: primary
    right:
      - text: "Repository"
        icon: github
        href: "https://github.com/peeterlaas/MolEcoMeth"
  sidebar:
    style: docked
    search: false
    contents:
      - href: index.qmd
        text: "🏠 Home"
      - href: syllabus.qmd
        text: "📓 Syllabus"
      - href: schedule.qmd
        text: "🗓️ Schedule"
      - href: topics.qmd
        text: "🧭 Topics"
      - section: "👨‍🏫 Lectures"
        contents:
          - href: lectures/introduction.qmd
            text: "0 · Introduction & toolkit"
          - href: lectures/code_of_life.qmd
            text: "1 · The code of life"
          - href: lectures/lecture2.qmd
            text: "2 · The molecular toolkit"
          - href: lectures/lecture3.qmd
            text: "3 · Sequencing technologies"
          - href: lectures/loeng4.qmd
            text: "4 · Markers, barcoding & eDNA"
          - href: lectures/loeng5.qmd
            text: "5 · eDNA, hybridization & cytometry"
          - href: lectures/population_genetics.qmd
            text: "10 · Population genetics"
      - href: seminars/index.qmd
        text: "🎤 Seminars"
      - href: participation.qmd
        text: "✅ Participation"
      - href: materials.qmd
        text: "📚 Materials"
  page-footer:
    background: light
    left: "MLB7052.LT · Tallinna Ülikool · 2026/2027"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - css/site.scss
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    link-external-icon: true
    date-format: "D MMMM YYYY"
    email-obfuscation: javascript
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false
