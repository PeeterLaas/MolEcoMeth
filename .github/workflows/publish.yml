# Builds the course website and publishes it to GitHub Pages.
#
# The lecture decks are served from the committed _freeze/ cache, so this
# runner never re-executes their R code. Only the four data-driven pages
# (home, schedule, participation, seminars) run R here, and they need just a
# handful of light packages.
name: Publish site

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::yaml
            any::readr
            any::dplyr
            any::tidyr
            any::knitr
            any::htmltools
            any::tibble

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
