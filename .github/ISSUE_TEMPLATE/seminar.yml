name: "🎤 Seminar paper registration"
description: Claim the research article you will present
title: "[seminar] "
labels: ["seminar"]
body:
  - type: markdown
    attributes:
      value: |
        First come, first served. Check the
        [register](https://peeterlaas.github.io/MolEcoMeth/seminars/) before you claim.
  - type: input
    id: name
    attributes:
      label: Your name
      description: As it should appear on the seminar register.
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: DOI or URL
      placeholder: https://doi.org/10.1111/mec.12345
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this paper (optional)
      description: One or two sentences on the method it argues about.
    validations:
      required: false
