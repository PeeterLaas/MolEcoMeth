# ---------------------------------------------------------------------------
# MLB7052.LT — Kaasaegsed meetodid molekulaarses ökoloogias
# Kursuse veebileht. `quarto render` ehitab nii lehed kui ka kõik loenguslaidid.
#
# Sait on eestikeelne (2026/2027 lend on tervikuna eestikeelne). Loenguslaidid
# ise on endiselt ingliskeelsed — need on eraldi asi, mitte selle failiga
# tõlgitavad.
# ---------------------------------------------------------------------------

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "seminars/index.qmd"
    # Üliõpilaste üleslaaditud failid on allalaadimiseks lingitud, mitte kunagi
    # renderdatud — Quarto ei tohi käivitada koodi, mis saabub pull request'iga.
    - "!seminars/slides/"
    # Jäänused mitteseotud Shiny rakendusest; kettal alles, saidilt väljas.
    - "!MolEcoMeth/"
    - "!www/"

# --- Kursuse faktid, mida lehed loevad, et need oleksid kirjas ühes kohas ----
course-code:     "MLB7052.LT"
course-title-et: "Kaasaegsed meetodid molekulaarses ökoloogias"
course-title-en: "Modern Molecular Methods in Ecology"
course-repo:     "https://github.com/peeterlaas/MolEcoMeth"
semester:        "2026/2027 sügis"
# Esimene õppereede. Kõik saidi kuupäevad tuletatakse sellest, nii et semestri
# nihutamine on ühe rea muudatus.
semester-start:  "2026-09-04"

# Logode teed, projekti suhtes. Slaidid on ühe taseme võrra all ja lisavad "..".
logo-tlu:     "assets/logos/UUtopleft.png"
logo-taltech: "assets/logos/taltech-logo.png"

lang: et

# Quarto 1.5 ei sisalda eestikeelset _language-et.yml faili, seega antakse
# liidese sõned siin. Ilma nendeta jääksid kõrvalriba pealkiri, otsing ja
# callout'ide päised ingliskeelseks.
language:
  toc-title-document: "Sisukord"
  toc-title-website: "Sellel lehel"
  callout-tip-title: "Nõuanne"
  callout-note-title: "Märkus"
  callout-warning-title: "Hoiatus"
  callout-important-title: "Tähtis"
  callout-caution-title: "Ettevaatust"
  section-title-footnotes: "Allmärkused"
  section-title-references: "Viidatud kirjandus"
  code-summary: "Kood"
  copy-button-tooltip: "Kopeeri lõikelauale"
  copy-button-tooltip-success: "Kopeeritud!"
  back-to-top: "Tagasi üles"
  search-label: "Otsi"
  search-text-placeholder: "Otsi saidilt"
  search-submit-button-title: "Otsi"
  search-clear-button-title: "Tühjenda"
  search-detached-cancel-button-title: "Loobu"
  search-no-results-text: "Vasteid ei leitud"
  search-matching-documents-text: "sobivat lehte"
  search-copy-link-title: "Kopeeri otsingu link"
  search-hide-matches-text: "Peida ülejäänud vasted"
  search-more-match-text: "veel üks vaste sellel lehel"
  search-more-matches-text: "veel vasteid sellel lehel"

website:
  title: "MLB7052.LT — Molekulaarökoloogia meetodid"
  site-url: "https://peeterlaas.github.io/MolEcoMeth"
  favicon: "assets/logos/favicon.png"
  page-navigation: true
  reader-mode: true
  open-graph: true
  search:
    location: navbar
    type: textbox
  navbar:
    background: primary
    right:
      - text: "Repositoorium"
        icon: github
        href: "https://github.com/peeterlaas/MolEcoMeth"
  sidebar:
    style: docked
    search: false
    contents:
      - href: index.qmd
        text: "🏠 Avaleht"
      - href: syllabus.qmd
        text: "📓 Ainekava"
      - href: schedule.qmd
        text: "🗓️ Ajakava"
      - href: topics.qmd
        text: "🧭 Teemad"
      - section: "👨‍🏫 Loengud"
        contents:
          - href: lectures/introduction.qmd
            text: "0 · Sissejuhatus ja töövahendid"
          - href: lectures/code_of_life.qmd
            text: "1 · Elu kood"
          - href: lectures/lecture2.qmd
            text: "2 · Molekulaarne tööriistakast"
          - href: lectures/lecture3.qmd
            text: "3 · Sekveneerimistehnoloogiad"
          - href: lectures/loeng4.qmd
            text: "4 · Markerid, vöötkoodid ja eDNA"
          - href: lectures/loeng5.qmd
            text: "5 · eDNA, hübridisatsioon ja tsütomeetria"
          - href: lectures/population_genetics.qmd
            text: "10 · Populatsioonigeneetika"
      - href: seminars/index.qmd
        text: "🎤 Seminarid"
      - href: participation.qmd
        text: "✅ Osalemine"
      - href: materials.qmd
        text: "📚 Materjalid"
  page-footer:
    background: light
    left: "MLB7052.LT · Tallinna Ülikool · 2026/2027"
    right: "Tehtud [Quarto](https://quarto.org) abil"

format:
  html:
    theme:
      - cosmo
      - css/site.scss
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    link-external-icon: true
    date-format: "D. MMMM YYYY"
    email-obfuscation: javascript
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false
